name: v2.4 diagnostic sync

on:
  push:
    paths:
      - ".release-sync/ready"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble exact tested diagnostic
        shell: bash
        run: |
          cat .release-sync/info-diagnostic.part1.b64 \
              .release-sync/info-diagnostic.part2a.b64 \
              .release-sync/info-diagnostic.part2b.b64 \
              .release-sync/info-diagnostic.part3.b64 \
              .release-sync/info-diagnostic.part4.b64 \
              .release-sync/info-diagnostic.part5.b64 \
            | base64 -d > bitburnerFiles/info-diagnostic.js
          test "$(git hash-object bitburnerFiles/info-diagnostic.js)" = "f3ef0afad85b107d18bd553f0d275f8e7a4b2b77"

      - name: Commit exact tested file
        shell: bash
        run: |
          git config user.name "Jim P"
          git config user.email "moomf@hotmail.com"
          git add bitburnerFiles/info-diagnostic.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync tested diagnostic for v2.4"
          git push
